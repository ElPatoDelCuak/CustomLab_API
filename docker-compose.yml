services:
  web:
    build: .
    container_name: customlab_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - customlab_network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: customlab_proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - customlab_network
    restart: unless-stopped

networks:
  customlab_network:
    external: true
