server {
    listen 80;
    server_name customlab.duckdns.org;

    # Reto de Certbot para HTTP-01 (por si acaso se usa en el futuro)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección de HTTP (8080) a HTTPS (8443)
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name customlab.duckdns.org;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/customlab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customlab.duckdns.org/privkey.pem;

    # Recomendaciones de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Tamaño máximo de subida
    client_max_body_size 20M;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }

    # Servir archivos estáticos directamente (opcional pero recomendado)
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
